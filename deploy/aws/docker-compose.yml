# Single-box deployment (EC2 t4g.small, arm64). Caddy fronts both services on
# one origin so cookies are first-party and no CORS is needed.
#   /v1/*, /healthz  → api:8080
#   everything else  → web:3000
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      WEB_ORIGINS: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PAYGATE_SECRET: ${PAYGATE_SECRET:-}
    expose: ["8080"]

  # MPP (Tempo) payment gateway in front of POST /v1/rentals for API-key
  # clients. Disabled (not started) unless MPP_RECIPIENT is set: use
  #   docker compose --profile mpp up -d --build
  paygate:
    profiles: ["mpp"]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.paygate
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      PAYGATE_SECRET: ${PAYGATE_SECRET}
      MPP_SECRET_KEY: ${MPP_SECRET_KEY}
      MPP_RECIPIENT: ${MPP_RECIPIENT}
      MPP_REALM: ${MPP_REALM:-rentpc}
      TEMPO_RPC_URL: ${TEMPO_RPC_URL:-https://rpc.moderato.tempo.xyz}
      # pathUSD: the testnet stablecoin the faucet and the web wallet button use.
      # mpp-go's default is OUSD, which the faucet does not hand out.
      MPP_CURRENCY: ${MPP_CURRENCY:-0x20c0000000000000000000000000000000000000}
    expose: ["8090"]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      RENT_UPSTREAM: ${RENT_UPSTREAM:-api:8080}   # set to paygate:8090 when the mpp profile is on
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

volumes:
  caddy_data:
  caddy_config:
